<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NeighbourLink — Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="no-bottom-nav">
  <div class="auth-page">
    <div class="auth-card card">
      <div class="auth-brand">
        <div class="brand-name">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C8 2 4 6 4 10c0 5.25 7 11 8 12 1-1 8-6.75 8-12 0-4-4-8-8-8z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          NeighbourLink
        </div>
        <p class="brand-tagline">Community ride sharing, built on trust</p>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your account</p>

      <form onsubmit="event.preventDefault(); window.location.href=document.getElementById('email').value.includes('@admin.com')  ? 'admin.html' : 'dashboard.html';">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" value="emma.wilson@email.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Your password" value="password123">
        </div>
        <div class="form-group" style="text-align:right;">
          <a href="#" class="text-sm">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </div>
</body>
</html>
