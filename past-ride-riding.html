<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NeighbourLink — Past Ride</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="dashboard.html" class="topbar-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C8 2 4 6 4 10c0 5.25 7 11 8 12 1-1 8-6.75 8-12 0-4-4-8-8-8z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      NeighbourLink
    </a>
  </header>

  <div class="page">
    <div class="card">
      <div class="route-visual">
        <div class="route-point">
          <div class="label">Pick-up</div>
          <div class="location">Homebush</div>
        </div>
        <div class="route-line-long"></div>
        <div class="route-point">
          <div class="label">Drop-off</div>
          <div class="location">Olympic Park</div>
        </div>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Date</div>
          <div class="info-value">12 Apr 2026</div>
        </div>
        <div class="info-item">
          <div class="info-label">Time</div>
          <div class="info-value">10:00 AM</div>
        </div>
        <div class="info-item">
          <div class="info-label">Your role</div>
          <div class="info-value">Rider</div>
        </div>
        <div class="info-item">
          <div class="info-label">Cost</div>
          <div class="info-value">$4</div>
        </div>
      </div>
    </div>

    <!-- Show the driver (opposite user) -->
    <div class="section-title">
      <span>Driver</span>
    </div>

    <div class="card">
      <div class="ride-user" style="gap:.75rem;">
        <a href="profile-other.html" class="avatar">LT</a>
        <div style="flex:1;">
          <a href="profile-other.html" class="fw-500" style="font-size:.88rem;">Lisa Tran</a>
          <div class="text-sm text-secondary">&#9733; 4.9 · 7 rides</div>
        </div>
      </div>
    </div>

    <!-- Rate the driver -->
    <div class="section-title">
      <span>Rate this driver</span>
    </div>

    <div class="card" style="text-align:center;">
      <p class="text-sm text-secondary mb-1">How was your ride with Lisa?</p>
      <div class="star-select" style="margin-bottom:.5rem;">
        <input type="radio" id="r5" name="rating" value="5"><label for="r5">&#9733;</label>
        <input type="radio" id="r4" name="rating" value="4"><label for="r4">&#9733;</label>
        <input type="radio" id="r3" name="rating" value="3"><label for="r3">&#9733;</label>
        <input type="radio" id="r2" name="rating" value="2"><label for="r2">&#9733;</label>
        <input type="radio" id="r1" name="rating" value="1"><label for="r1">&#9733;</label>
      </div>
      <div class="form-group" style="text-align:left;">
        <label for="review">Leave a comment (optional)</label>
        <textarea id="review" class="form-control" placeholder="e.g. Great driver, very safe and on time!"></textarea>
      </div>
      <a href="riding.html" class="btn btn-primary btn-block">Submit rating</a>
      <p class="text-sm text-secondary mt-1"><a href="riding.html">Skip for now</a></p>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
      Home
    </a>
    <a href="driving.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>
      Driving
    </a>
    <a href="riding.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      Riding
    </a>
    <a href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4-4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
  </nav>
</body>
</html>
